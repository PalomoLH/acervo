<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acervo de Jogos</title>
<script>try { const t = localStorage.getItem('acervo.tema'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topo">
  <h1>🎲 Acervo de Jogos</h1>
  <span id="salvamento"></span>
  <nav><a href="index.html" class="ativo">Acervo</a><a href="gerenciar.html" class="so-admin">Gerenciar</a></nav>
  <div class="ferramentas"><button id="tema"></button><button id="admin"></button></div>
</header>

<div class="filtros">
  <input type="search" id="busca" placeholder="Buscar jogo…">
  <select id="dono"><option value="">Todos os donos</option></select>
  <select id="ordem">
    <option value="nome">Ordenar: nome</option>
    <option value="status">Ordenar: marcação</option>
  </select>
</div>
<div class="filtros" id="chips"></div>
<p class="resumo" id="resumo">Carregando…</p>
<main class="grade" id="grade"></main>

<script type="module">
import { carregar, salvarJogo, STATUS, todosDonos, normalizar, esc } from './assets/store.js';
import { montarTopo } from './assets/ui.js';

let jogos = [];
const filtroStatus = new Set();
const $ = id => document.getElementById(id);
const ICONE = { sabemos: '✓', interesse: '★', vender: '$' };
const ORDEM_STATUS = { sabemos: 0, interesse: 1, vender: 2, '': 3 };

async function recarregar() {
  jogos = await carregar();
  const atual = $('dono').value;
  $('dono').length = 1;
  for (const d of todosDonos(jogos)) $('dono').add(new Option(d, d));
  $('dono').value = atual;
  render();
}

function renderChips() {
  const cont = Object.fromEntries(Object.keys(STATUS).map(k => [k, 0]));
  for (const j of jogos) cont[j.status || '']++;
  $('chips').innerHTML = Object.entries(STATUS).map(([k, s]) =>
    `<span class="chip" role="button" tabindex="0" data-k="${k}" aria-pressed="${filtroStatus.has(k)}">
       <span class="ponto" style="background:${s.cor}"></span>${s.label} (${cont[k]})</span>`).join('');
}

function render() {
  const q = normalizar($('busca').value.trim());
  const dono = $('dono').value;
  const lista = jogos.filter(j =>
    (!q || normalizar(j.nome).includes(q)) &&
    (!dono || j.donos.includes(dono)) &&
    (!filtroStatus.size || filtroStatus.has(j.status || '')));
  lista.sort((a, b) => $('ordem').value === 'status'
    ? ORDEM_STATUS[a.status || ''] - ORDEM_STATUS[b.status || ''] || a.nome.localeCompare(b.nome)
    : a.nome.localeCompare(b.nome));

  $('resumo').textContent = `${lista.length} de ${jogos.length} jogos`;
  $('grade').innerHTML = lista.map(j => `
    <article class="card" data-id="${j.id}" data-status="${j.status || ''}" title="${esc(STATUS[j.status || ''].label)}">
      <img class="capa" loading="lazy" src="${esc(j.imagem || '')}" alt="">
      <div class="info">
        <div class="nome">${j.link ? `<a href="${esc(j.link)}" target="_blank" rel="noopener">${esc(j.nome)}</a>` : esc(j.nome)}</div>
        <div class="donos">${esc(j.donos.join(', '))}</div>
        <div class="acoes so-admin">
          ${['sabemos', 'interesse', 'vender'].map(s =>
            `<button data-s="${s}" title="${STATUS[s].label}" aria-pressed="${j.status === s}">${ICONE[s]}</button>`).join('')}
        </div>
      </div>
    </article>`).join('');
  renderChips();
}

$('grade').addEventListener('click', e => {
  const btn = e.target.closest('button[data-s]');
  if (!btn) return;
  const jogo = jogos.find(j => j.id === btn.closest('.card').dataset.id);
  jogo.status = jogo.status === btn.dataset.s ? '' : btn.dataset.s;
  salvarJogo(jogo);
  render();
});

function toggleChip(e) {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const k = chip.dataset.k;
  filtroStatus.has(k) ? filtroStatus.delete(k) : filtroStatus.add(k);
  render();
}
$('chips').addEventListener('click', toggleChip);
$('chips').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleChip(e); } });
for (const id of ['busca', 'dono', 'ordem']) $(id).addEventListener('input', render);

montarTopo(recarregar);
recarregar();
</script>
</body>
</html>
